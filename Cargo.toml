[workspace]
resolver = "2"
members = ["crates/prefixity-core", "crates/prefixity-cli", "crates/prefixity-live"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Prefixity contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
clap = { version = "4", features = ["derive"] }
