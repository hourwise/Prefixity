name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Verify the declared minimum supported Rust version stays buildable. The
  # declared MSRV (see workspace Cargo.toml rust-version) is driven by the
  # locked dependency graph (e.g. idna_adapter/icu require rustc 1.86), not
  # by Prefixity's own source, which remains Edition 2021. No clippy or
  # rustfmt is required here.
  msrv:
    name: MSRV (Rust 1.86.0, cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.86.0
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check at MSRV (locked)
        run: cargo check --workspace --locked
