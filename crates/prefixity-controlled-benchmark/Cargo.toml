[package]
name = "prefixity-controlled-benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Isolated deterministic Phase 1B.7 controlled benchmark artifact."

[[bin]]
name = "prefixity-phase1c-stage1-smoke"
path = "src/bin/phase1c_stage1_local_qwen.rs"

[[bin]]
name = "prefixity-phase1c-stage1-reasoning-off-preflight"
path = "src/bin/phase1c_stage1_reasoning_off_preflight.rs"

[[bin]]
name = "prefixity-phase1c-stage1-reasoning-off-live"
path = "src/bin/phase1c_stage1_reasoning_off_live.rs"

[[bin]]
name = "prefixity-phase1c-stage1-reasoning-off-postrun"
path = "src/bin/phase1c_stage1_reasoning_off_postrun.rs"

[[bin]]
name = "prefixity-phase1c-local-evidence-certification"
path = "src/bin/phase1c_local_evidence_certification.rs"

[[bin]]
name = "prefixity-phase1c-scored-design"
path = "src/bin/phase1c_scored_design.rs"

[[bin]]
name = "prefixity-phase1c-h001"
path = "src/bin/phase1c_h001.rs"

[[bin]]
name = "prefixity-phase1c-h001-v2"
path = "src/bin/phase1c_h001_v2.rs"

[[bin]]
name = "prefixity-phase1c-live-supervisor"
path = "src/bin/phase1c_live_supervisor.rs"

[[bin]]
name = "prefixity-phase1c-reasoning-budget-calibration"
path = "src/bin/phase1c_reasoning_budget_calibration.rs"

[[bin]]
name = "prefixity-phase1c-v3-feasibility"
path = "src/bin/phase1c_v3_feasibility.rs"

[dependencies]
prefixity-core = { path = "../prefixity-core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
windows-sys = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
